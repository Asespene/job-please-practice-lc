[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "interview-prep"
version = "0.1.0"
description = "Pattern-first LeetCode and technical interview prep repository"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pytest>=7.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests", "patterns"]
python_files = ["test_*.py", "[0-9][0-9][0-9][0-9]-*.py"]
python_functions = ["test_*"]
addopts = "-q"
